name: Prices

# TCGplayer's catalog and prices for English and Japanese Pokémon, from TCGCSV,
# into data/ (docs/decisions/0001-the-data-job.md): nightly, by hand, and when
# the job's code changes. No secrets: the steps read a public site, push with
# the run's own token, and publish the day's catalog as the npm package
# superbad-data by trusted publishing (the run's OIDC token, set on npmjs.com;
# docs/decisions/0002-the-npm-feed.md). An NPM_TOKEN secret, if one exists, is
# used instead (the first publish needed one). Off main the build runs and
# nothing is committed or published. Failures come back as annotations
# (tools/ci/report.sh).
on:
  schedule:
    # 21:37 UTC: TCGCSV refreshes around 20:00 UTC.
    - cron: '37 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - jobs/prices/**
      - packages/core/**
      - .github/workflows/prices.yml

# One run at a time per branch; a run is never cancelled halfway through a commit.
concurrency:
  group: prices-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # npm trusted publishing (the publish step only)

jobs:
  prices:
    # Dependabot's pushes build nothing.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Set the working folders
        run: |
          {
            echo "RAW=$RUNNER_TEMP/raw"
            echo "OUT=$RUNNER_TEMP/out"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download one day from TCGCSV
        run: bash tools/ci/report.sh "TCGCSV fetch failed" node jobs/prices/fetch.ts --out "$RAW"

      - name: Keep the raw download for 14 days
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tcgcsv-raw-${{ github.run_id }}
          path: ${{ env.RAW }}
          retention-days: 14
          compression-level: 9

      - name: Build the data tree
        run: >-
          bash tools/ci/report.sh "Prices build failed"
          node jobs/prices/build.ts --raw "$RAW" --history data/history --out "$OUT"

      - name: Commit the data (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          as_of=$(jq -r '.asOf' "$OUT/summary.json")
          rm -rf data
          cp -r "$OUT" data
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "::notice title=Prices unchanged::TCGCSV's day $as_of is already in the repo"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data
          git commit -m "Prices as of $as_of"
          # A push to main between the checkout and now (a code change) is taken in first.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error title=Push failed::main moved three times while the data was being committed"
          exit 1

      # Trusted publishing needs npm 11.5.1 or newer; Node 24 bundles one. The
      # build above stays on Node 22, the version CI tests.
      - name: Node 24 for the publish step
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Publish the day's catalog to npm (main only)
        if: github.ref == 'refs/heads/main'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          bash tools/ci/report.sh "npm publish failed"
          node jobs/prices/publish.ts --data data --out "$RUNNER_TEMP/npm"

      - name: Report counts
        if: always()
        run: |
          if [ -f "$OUT/summary.json" ]; then
            counts=$(jq -c '{asOf, rows, priced, withM7, withM30, lookback, issueCounts}' "$OUT/summary.json")
            echo "::notice title=Prices counts::${counts}"
          fi
